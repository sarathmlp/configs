# Use GPU video output
vo=gpu

# High-quality preset
profile=gpu-hq

# Enable hardware decoding when possible
hwdec=auto

# Scaling algorithms (best quality)
# scale=ewa_lanczossharp
# cscale=ewa_lanczossharp
# dscale=mitchell

# Slightly lighter scaling algorithms
scale=lanczos
cscale=lanczos
dscale=mitchell

# Dithering and debanding (smooth gradients)
dither-depth=auto
deband=yes

# Enables automatic ICC color profile management
icc-profile-auto=yes

# Audio Output: Use macOS native audio driver
ao=coreaudio

# Prevent clipping during downmixing from multi-channel to stereo
audio-normalize-downmix=yes

# Enable on-screen controller (optional)
osc=yes
